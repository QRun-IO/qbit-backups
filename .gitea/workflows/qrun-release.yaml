# Standard QRun release caller (v2, thin contract): every push and manual dispatch delegates to the protected qrun-release-v1 channel. Do not edit per repository.
name: qrun-release
on:
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  release:
    uses: self:KofTwentyTwo/platform-ci/.gitea/workflows/java-docker.yaml@qrun-release-v1
    with:
      runner: linux-small
      docker-runner: container-build
      browsers: true
      browser-runner: browser-build
