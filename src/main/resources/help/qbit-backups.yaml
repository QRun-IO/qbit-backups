- key: app:backups;slot:help
  summary: "Back up, verify and restore the application's data to S3-compatible storage."
  content: |
    Use the **Setup** card on the home to review what a working backup needs (a plan, a storage bucket, a schedule, verification) with the next step for each. A new installation has no plan: run Create default plan on Backup plans, which asks only for the storage bucket alias, or add a plan with New. Everything else (runs, artifacts, verifications, restores) is written by the backups themselves.

- key: table:backups_plan;slot:help
  summary: "A backup plan: what is backed up, where it goes, when it runs, how long it is kept and how it is verified."
  content: |
    **How rows get created:** add a plan with **New**, or run **Create default plan**, which adds "Nightly full" (the whole instance, data and audit tables, JSONL and gzip, every night at 02:00 UTC, verified on Sundays) and asks only for the storage bucket alias. The alias names a bucket your application provides to Backups; no key or endpoint is ever stored here. With the scheduler integration installed, an active plan with a cron expression runs on schedule; Run backup now runs it by hand. A few settings (PARQUET, ZSTD, incremental, native dump, read replica) are not available yet and are refused when the plan is saved.

- key: table:backups_plan_scope;slot:help
  summary: "One include or exclude rule of a plan: an app, a qbit, a table or a table role."
  content: |
    **How rows get created:** add **Scope rules** on a plan record. A plan whose scope is Instance backs up everything allowed by its roles and needs no rules; a plan limited to apps, qbits or tables is made of these rules, and an Exclude rule always wins over an Include.

- key: table:backups_run;slot:help
  summary: "One execution of a plan, or an ad-hoc export: its status, size, rows, files and storage location."
  content: |
    **How rows get created:** only the backups write it. Run backup now, a plan's schedule, a pre-restore safety backup, Resume and Import backups from storage each add a row. Nothing is added by hand; Verify backup, Download, Restore and Prune are actions on a run.

- key: table:backups_artifact;slot:help
  summary: "One stored object of a run: a table part, its manifest, checksums or a file index, with its hash and size."
  content: |
    **How rows get created:** only the backups write it, one row per object a run stores. Open **Artifacts** on a run record to use **Restore this table** or **Download**.

- key: table:backups_verification;slot:help
  summary: "The result of checking a backup: that it is in storage, that it decodes, or that it restores into scratch."
  content: |
    **How rows get created:** only verification writes it. Run Verify backup on a run (storage, content or test restore), or give a plan a verify cron expression so it verifies its latest backup on a schedule. Inspect the newest result on the plan and the home.

- key: table:backups_restore_run;slot:help
  summary: "One restore of a backup into the application: mode, id strategy, row and file counts and its safety backup."
  content: |
    **How rows get created:** only Restore writes it. Run Restore on a backup run, or Restore this table on an artifact: Review previews what would change before anything is written. A restore that replaces data takes a safety backup first and links it here.

- key: table:backups_restore_run_table;slot:help
  summary: "Per-table results of a restore: rows inserted, updated and skipped and how the schema matched."
  content: |
    **How rows get created:** only Restore writes it, one row per table restored. Open **Tables restored** on a restore record to inspect these results.

- key: table:backups_file_object;slot:help
  summary: "The content-addressed store of copied files, shared by runs, with reference counts and verification."
  content: |
    **How rows get created:** only backups write it. When a plan copies the files its rows reference, each distinct file (by SHA-256) is stored once and every run that uses it adds a reference; Prune lowers the counts and removes a file when no run needs it.

- key: table:backups_id_map;slot:help
  summary: "Old id to new id pairs recorded while restoring with new ids, so related rows can be rewritten."
  content: |
    **How rows get created:** only Restore writes it, and only when a restore uses the Remap new ids strategy. The rows are working data for that restore and are cleared when it finishes, so you will usually find this table empty.

- key: table:backups_plan;field:storageBucketAlias
  summary: The configured storage alias where you want this plan to write backups.
  content: |
    Enter the alias of a bucket your application provides to Backups, never credentials or an endpoint. Use **Test destination** to check access before running the plan. You can select a separate **Prune bucket alias** for deletion access.
- key: table:backups_plan;field:cronExpression
  summary: The schedule expression for running this plan automatically.
  content: |
    Set the schedule and **{{label:backups_plan.cronTimeZoneId}}** together. Your application must install the scheduler integration, and the plan must be active. Leave the expression blank for manual runs. Use **Run backup now** to preview and start a backup yourself.
- key: process:backupsPlanCreateDefault;slot:help
  summary: Create a starter backup plan for a storage bucket you choose.
  content: |
    Use **Create default plan** on **Backup plans** and enter a **Storage bucket alias** provided by your application. Review the proposed plan before continuing. The action adds **Nightly full** for data and audit tables with JSONL, gzip and copied files, scheduled at 02:00 UTC with content verification on Sundays at 04:00 UTC.

    You can edit the settings afterward. The action creates a plan only when its plan key does not already exist; it does not change an existing plan. Scheduled execution requires your application's scheduler integration.
- key: process:backupVerifyPlan;slot:help
  summary: Verify the latest successful backup of a scheduled plan.
  content: |
    Use the plan's verification schedule and level to control automatic checks. This background action selects its latest successful backup and records the check in **Verification**. If no successful backup exists, there is nothing to verify. Inspect the plan and its latest verification result when investigating missed or failed checks.
- key: process:*.backupExportTable;slot:help
  summary: Preview and back up selected table records using your current access.
  content: |
    Use **Back up these records** to export records from a table. Review the selected scope before continuing; the preview writes nothing. Your record access applies to this export. The destination comes from the supplied storage alias or an active plan. Inspect the resulting **Backup Run** and verify it before relying on it for recovery.

