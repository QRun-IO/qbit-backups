bundle: qbit-backups
version: ${project.version}
layer: QBIT
entries:
- key: table:backups_plan;field:name
  summary: 'The display name of the backup plan.'
- key: table:backups_plan;field:description
  summary: 'Your notes about the purpose and coverage of this plan.'
- key: table:backups_plan;field:planKey
  summary: 'A stable short name used in the storage paths of this plan’s backups.'
  content: |
    Choose a stable lowercase name using letters, digits, dashes or underscores, within {{maxLength:backups_plan.planKey}} characters. This name becomes part of stored object paths. It cannot change after the plan has run. If you need a different storage identity, create another plan and keep the existing plan and its run history available for recovery.
- key: table:backups_plan;field:isActive
  summary: 'Whether this plan is active for scheduled execution.'
- key: table:backups_plan;field:scopeType
  summary: 'How this plan selects the data to back up.'
  content: |
    Scope and table roles control which data a plan selects. Use **Backup Plan Scope** rules to include or exclude particular targets and narrow records when needed. Review the resolved selection with **Run backup now** before continuing, especially after application metadata changes. Excluded data will not be available from this backup even if the run itself completes successfully.
- key: table:backups_plan;field:includeRoles
  summary: 'The comma-separated table roles included by the plan.'
  content: |
    Scope and table roles control which data a plan selects. Use **Backup Plan Scope** rules to include or exclude particular targets and narrow records when needed. Review the resolved selection with **Run backup now** before continuing, especially after application metadata changes. Excluded data will not be available from this backup even if the run itself completes successfully.
- key: table:backups_plan;field:pruneBucketAlias
  summary: 'The storage connection alias used when removing expired backups.'
  content: |
    This alias selects the configured storage access used for pruning. It can separate deletion access from the destination used to write backups. Enter a storage alias rather than connection credentials, and check it before requesting retention cleanup. **Prune per retention** previews proposed deletions; locked objects and retained backups remain subject to their protection rules.
- key: table:backups_plan;field:prefix
  summary: 'The storage path prefix under which this plan writes backups.'
- key: table:backups_plan;field:critical
  summary: 'Whether this plan is marked as critical for backup monitoring.'
  content: |
    Monitoring compares successful backup and verification history with the plan’s expected ages. Use the health result to decide which **Backup Run** or **Verification** to inspect. A recent run can still need verification, and a failed run can leave an older successful backup in place. Adjust expectations to your recovery needs rather than treating a changed threshold as a repair.
- key: table:backups_plan;field:format
  summary: 'The file format used for exported table records.'
  content: |
    The default is {{default:backups_plan.format}} and the metadata choices are {{values:backups_format}}. JSONL supports structured record content, while CSV provides a tabular representation; both can be requested together. Parquet is listed but is not implemented in this version and is rejected by validation. Review the backup’s artifacts afterward to see the files actually produced.
- key: table:backups_plan;field:compression
  summary: 'The compression applied to exported backup data.'
  content: |
    The default is {{default:backups_plan.compression}} and the metadata choices are {{values:backups_compression}}. Use GZIP to compress exported data or NONE to leave it uncompressed. ZSTD is listed but is not implemented in this version. Compare raw and stored byte counts on **Backup Run** or **Artifacts** when assessing the resulting storage size.
- key: table:backups_plan;field:encryptionMode
  summary: 'The encryption mode requested for backup content.'
  content: |
    Review these settings together before including sensitive data. Encryption support depends on the configured backup implementation; unsupported client encryption is rejected. A key reference names a key and must never contain its value. Encrypted-only inclusion requires client encryption, while including sensitive fields in the clear requires backup administrator permission. Check the preview and validation messages before running the plan.
- key: table:backups_plan;field:encryptionKeyRef
  summary: 'The name of the encryption key to resolve, never the key value.'
  content: |
    Review these settings together before including sensitive data. Encryption support depends on the configured backup implementation; unsupported client encryption is rejected. A key reference names a key and must never contain its value. Encrypted-only inclusion requires client encryption, while including sensitive fields in the clear requires backup administrator permission. Check the preview and validation messages before running the plan.
- key: table:backups_plan;field:sensitiveFieldPolicy
  summary: 'How fields marked sensitive are handled in this backup.'
  content: |
    Review these settings together before including sensitive data. Encryption support depends on the configured backup implementation; unsupported client encryption is rejected. A key reference names a key and must never contain its value. Encrypted-only inclusion requires client encryption, while including sensitive fields in the clear requires backup administrator permission. Check the preview and validation messages before running the plan.
- key: table:backups_plan;field:heavyFieldPolicy
  summary: 'How large field values are included or omitted in this backup.'
  content: |
    Choose how large field values should be represented in the backup. The default is {{default:backups_plan.heavyFieldPolicy}} and the configured choices are {{values:backups_heavy_policy}}. Including values inline, placing them in separate objects and excluding them have different recovery implications. Review the resulting artifacts and verify a backup before relying on it to recover records with large content.
- key: table:backups_plan;field:fileObjectPolicy
  summary: 'Whether referenced files are copied or only referenced in the backup.'
  content: |
    File handling is separate from exporting database records. Copying referenced files keeps their content with the backup; reference-only handling does not make an independent copy. The missing-file policy determines whether an unavailable source file produces a warning or fails the run. Check copied and missing file counts on **Backup Run**, and verify media recovery as well as record recovery.
- key: table:backups_plan;field:fileMissingPolicy
  summary: 'Whether a missing referenced file warns or fails the backup.'
  content: |
    File handling is separate from exporting database records. Copying referenced files keeps their content with the backup; reference-only handling does not make an independent copy. The missing-file policy determines whether an unavailable source file produces a warning or fails the run. Check copied and missing file counts on **Backup Run**, and verify media recovery as well as record recovery.
- key: table:backups_plan;field:consistency
  summary: 'The requested consistency of reads across the backed-up data.'
  content: |
    The default is {{default:backups_plan.consistency}} and the available requests are {{values:backups_consistency}}. A shared snapshot helps keep related records consistent while the application changes. Support depends on the source backend. After a run, inspect **{{label:backups_run.consistencyAchieved}}** rather than assuming the requested level was achieved. Review warnings before relying on the backup for recovery.
- key: table:backups_plan;field:useReadReplica
  summary: 'Read replica requests are unavailable and are rejected when you save the plan.'
- key: table:backups_plan;field:incrementalMode
  summary: 'Whether the plan requests a full backup or changed records only.'
  content: |
    The default is {{default:backups_plan.incrementalMode}}. This version supports full backups; requesting only records changed since the previous backup is rejected by validation. Keep the plan on the supported full mode and use scope rules when you need to limit selected data. Review **Backup Run** and its artifacts to confirm the resulting coverage.
- key: table:backups_plan;field:nativeDump
  summary: 'The native database dump mode requested in addition to logical data.'
  content: |
    The default is {{default:backups_plan.nativeDump}}. Native database dumps are not implemented in this version, so selecting a native dump mode is rejected. Use the supported logical backup formats to save table records and referenced files. Those backups have their own manifests, verification and restore workflow; do not assume they contain a database-engine dump.
- key: table:backups_plan;field:cronTimeZoneId
  summary: 'The time zone used to interpret this plan’s schedule.'
- key: table:backups_plan;field:scheduledJobId
  summary: 'An unused legacy scheduler reference; you do not need to set it.'
- key: table:backups_plan;field:slaHours
  summary: 'The maximum expected age of a successful backup, in hours.'
  content: |
    Monitoring compares successful backup and verification history with the plan’s expected ages. Use the health result to decide which **Backup Run** or **Verification** to inspect. A recent run can still need verification, and a failed run can leave an older successful backup in place. Adjust expectations to your recovery needs rather than treating a changed threshold as a repair.
- key: table:backups_plan;field:verifySlaDays
  summary: 'The maximum expected age of a verified backup, in days.'
  content: |
    Monitoring compares successful backup and verification history with the plan’s expected ages. Use the health result to decide which **Backup Run** or **Verification** to inspect. A recent run can still need verification, and a failed run can leave an older successful backup in place. Adjust expectations to your recovery needs rather than treating a changed threshold as a repair.
- key: table:backups_plan;field:verifyFileSamplePercent
  summary: 'The percentage of referenced files selected for verification.'
  content: |
    Verification has its own depth, file selection and schedule. Checking stored objects is different from comparing decoded content or testing a restore. Review **Verification** to see which level actually ran and what it checked. Scheduling depends on the host integration; a saved expression alone is not evidence of a completed check. Use **Verify backup** for a direct content check.
- key: table:backups_plan;field:verifyCronExpression
  summary: 'The schedule expression for automatic verification.'
  content: |
    Verification has its own depth, file selection and schedule. Checking stored objects is different from comparing decoded content or testing a restore. Review **Verification** to see which level actually ran and what it checked. Scheduling depends on the host integration; a saved expression alone is not evidence of a completed check. Use **Verify backup** for a direct content check.
- key: table:backups_plan;field:verifyLevel
  summary: 'The depth of checking requested for automatic verification.'
  content: |
    Verification has its own depth, file selection and schedule. Checking stored objects is different from comparing decoded content or testing a restore. Review **Verification** to see which level actually ran and what it checked. Scheduling depends on the host integration; a saved expression alone is not evidence of a completed check. Use **Verify backup** for a direct content check.
- key: table:backups_plan;field:retainDaily
  summary: 'The number of daily backup periods retained by pruning.'
  content: |
    Retention selects backups to keep across daily, weekly, monthly and yearly periods, with a minimum number protected from pruning. Changing these settings does not itself prove which objects will be deleted. Use **Prune per retention** and review its proposed deletions before continuing. Storage locks can prevent deletion even when a backup falls outside the requested retention periods.
- key: table:backups_plan;field:retainWeekly
  summary: 'The number of weekly backup periods retained by pruning.'
  content: |
    Retention selects backups to keep across daily, weekly, monthly and yearly periods, with a minimum number protected from pruning. Changing these settings does not itself prove which objects will be deleted. Use **Prune per retention** and review its proposed deletions before continuing. Storage locks can prevent deletion even when a backup falls outside the requested retention periods.
- key: table:backups_plan;field:retainMonthly
  summary: 'The number of monthly backup periods retained by pruning.'
  content: |
    Retention selects backups to keep across daily, weekly, monthly and yearly periods, with a minimum number protected from pruning. Changing these settings does not itself prove which objects will be deleted. Use **Prune per retention** and review its proposed deletions before continuing. Storage locks can prevent deletion even when a backup falls outside the requested retention periods.
- key: table:backups_plan;field:retainYearly
  summary: 'The number of yearly backup periods retained by pruning.'
  content: |
    Retention selects backups to keep across daily, weekly, monthly and yearly periods, with a minimum number protected from pruning. Changing these settings does not itself prove which objects will be deleted. Use **Prune per retention** and review its proposed deletions before continuing. Storage locks can prevent deletion even when a backup falls outside the requested retention periods.
- key: table:backups_plan;field:retainMinimum
  summary: 'The minimum number of successful backups protected from pruning.'
  content: |
    Retention selects backups to keep across daily, weekly, monthly and yearly periods, with a minimum number protected from pruning. Changing these settings does not itself prove which objects will be deleted. Use **Prune per retention** and review its proposed deletions before continuing. Storage locks can prevent deletion even when a backup falls outside the requested retention periods.
- key: table:backups_plan;field:objectLockMode
  summary: 'The storage retention-lock mode requested for backup objects.'
  content: |
    Object locking asks the storage service to protect backup objects from deletion for the specified period. The selected destination must support locking, and a non-disabled mode requires a duration. These protections can prevent pruning from removing objects. Use **Test destination** to inspect capability information and review the retention requirements before choosing a locked destination.
- key: table:backups_plan;field:objectLockDays
  summary: 'How many days backup objects should remain locked in storage.'
  content: |
    Object locking asks the storage service to protect backup objects from deletion for the specified period. The selected destination must support locking, and a non-disabled mode requires a duration. These protections can prevent pruning from removing objects. Use **Test destination** to inspect capability information and review the retention requirements before choosing a locked destination.
- key: table:backups_plan;field:maxDurationMinutes
  summary: 'The configured backup duration limit in minutes.'
- key: table:backups_plan;field:pageSize
  summary: 'The number of records requested per backup read page.'
- key: table:backups_plan;field:targetPartBytes
  summary: 'The target size in bytes for each exported data part.'
- key: table:backups_plan;field:ownerUserId
  summary: 'The user whose access is checked for this plan’s scheduled backups.'
  content: |
    Scheduled backups check that the plan owner can read the selected tables. An active plan can run with broad data access, so saving an active plan requires backup administrator permission. Keep the owner and scope aligned as access changes. If scheduling reports an invalid owner, correct the owner or permissions and inspect **Backup Run** for subsequent results.
- key: table:backups_plan;field:lastRunId
  summary: 'The latest backup run associated with this plan.'
- key: table:backups_plan;field:lastSuccessRunId
  summary: 'The latest successful backup run for this plan.'
- key: table:backups_plan;field:lastSuccessDate
  summary: 'When this plan last completed a successful backup.'
- key: table:backups_plan;field:lastVerifiedRunId
  summary: 'The most recently verified backup run for this plan.'
- key: table:backups_plan;field:lastVerifiedDate
  summary: 'When a backup for this plan was last verified.'
- key: table:backups_plan;field:slaStatus
  summary: 'The current assessment of this plan’s backup health and timeliness.'
  content: |
    Monitoring compares successful backup and verification history with the plan’s expected ages. Use the health result to decide which **Backup Run** or **Verification** to inspect. A recent run can still need verification, and a failed run can leave an older successful backup in place. Adjust expectations to your recovery needs rather than treating a changed threshold as a repair.
- key: table:backups_plan_scope;field:backupPlanId
  summary: 'The backup plan this scope rule belongs to.'
- key: table:backups_plan_scope;field:action
  summary: 'Whether matching data is included in or excluded from the plan.'
- key: table:backups_plan_scope;field:selectorType
  summary: 'Whether the selector identifies a table, application, component or table role.'
  content: |
    Use these settings to describe the data matched by this scope rule. The selector identifies a target; a structured filter can narrow its records, child inclusion can expand related records, and exclusions omit fields. Review the resolved result through **Run backup now** before continuing. A successful backup cannot recover records or fields that its scope left out.
- key: table:backups_plan_scope;field:selectorValue
  summary: 'The name matched by the chosen selector type.'
  content: |
    Use these settings to describe the data matched by this scope rule. The selector identifies a target; a structured filter can narrow its records, child inclusion can expand related records, and exclusions omit fields. Review the resolved result through **Run backup now** before continuing. A successful backup cannot recover records or fields that its scope left out.
- key: table:backups_plan_scope;field:filterJson
  summary: 'A structured record filter that narrows the selected data.'
  content: |
    Use these settings to describe the data matched by this scope rule. The selector identifies a target; a structured filter can narrow its records, child inclusion can expand related records, and exclusions omit fields. Review the resolved result through **Run backup now** before continuing. A successful backup cannot recover records or fields that its scope left out.
- key: table:backups_plan_scope;field:includeAssociatedChildren
  summary: 'Whether the selection also follows associated child records.'
  content: |
    Use these settings to describe the data matched by this scope rule. The selector identifies a target; a structured filter can narrow its records, child inclusion can expand related records, and exclusions omit fields. Review the resolved result through **Run backup now** before continuing. A successful backup cannot recover records or fields that its scope left out.
- key: table:backups_plan_scope;field:fieldExclusions
  summary: 'The fields to omit from data selected by this scope rule.'
  content: |
    Use these settings to describe the data matched by this scope rule. The selector identifies a target; a structured filter can narrow its records, child inclusion can expand related records, and exclusions omit fields. Review the resolved result through **Run backup now** before continuing. A successful backup cannot recover records or fields that its scope left out.
- key: table:backups_run;field:backupPlanId
  summary: 'The plan that produced this backup.'
- key: table:backups_run;field:runKey
  summary: 'The unique storage reference for this backup execution.'
- key: table:backups_run;field:trigger
  summary: 'What caused this backup to run.'
- key: table:backups_run;field:requestedByUserId
  summary: 'The user who requested this operation.'
- key: table:backups_run;field:status
  summary: 'The recorded progress or final state of this operation.'
  content: |
    The run states are {{values:backups_run_status}}. Check the state alongside completed table counts, warnings and errors. A run that succeeded with warnings needs review, especially if referenced files were missing. Completion and verification are separate: inspect **Verification** before relying on the saved content. A cancellation request can take time to reach a final state.
- key: table:backups_run;field:startDate
  summary: 'When this operation started.'
- key: table:backups_run;field:endDate
  summary: 'When this operation ended.'
- key: table:backups_run;field:durationMs
  summary: 'The elapsed backup time in milliseconds.'
- key: table:backups_run;field:heartbeatDate
  summary: 'When the running backup last reported activity.'
- key: table:backups_run;field:tablesPlanned
  summary: 'The number of tables selected for this backup.'
- key: table:backups_run;field:tablesDone
  summary: 'The number of tables completed by this backup.'
- key: table:backups_run;field:rowsTotal
  summary: 'The total number of records exported.'
- key: table:backups_run;field:bytesRaw
  summary: 'The data size in bytes before storage encoding.'
- key: table:backups_run;field:bytesStored
  summary: 'The data size in bytes as stored.'
- key: table:backups_run;field:filesReferenced
  summary: 'The number of referenced files encountered during the backup.'
- key: table:backups_run;field:filesCopied
  summary: 'The number of files copied into backup storage.'
- key: table:backups_run;field:filesDeduplicated
  summary: 'The number of files whose existing backup copies were reused.'
- key: table:backups_run;field:filesMissing
  summary: 'The number of referenced files that could not be found.'
- key: table:backups_run;field:fileBytesCopied
  summary: 'The total bytes of file content copied into backup storage.'
- key: table:backups_run;field:fileBytesReferenced
  summary: 'The total bytes of file content referenced by this backup.'
- key: table:backups_run;field:consistencyAchieved
  summary: 'The read consistency actually achieved by this run.'
  content: |
    These values describe the saved backup rather than the current plan. The manifest records content and integrity information, while consistency and security scope describe how records were read. Use them when comparing backup coverage or investigating **Verification** failures. A user-selected export can contain fewer records than a broader scheduled plan because the user’s record access still applies.
- key: table:backups_run;field:snapshotId
  summary: 'The database snapshot identifier recorded for this backup.'
- key: table:backups_run;field:storageBucketAlias
  summary: 'The configured storage alias holding this backup content.'
- key: table:backups_run;field:runPrefix
  summary: 'The storage path prefix for this run’s objects.'
- key: table:backups_run;field:manifestKey
  summary: 'The storage path of the manifest describing this backup.'
  content: |
    These values describe the saved backup rather than the current plan. The manifest records content and integrity information, while consistency and security scope describe how records were read. Use them when comparing backup coverage or investigating **Verification** failures. A user-selected export can contain fewer records than a broader scheduled plan because the user’s record access still applies.
- key: table:backups_run;field:manifestSha256
  summary: 'The checksum used to identify and check the backup manifest.'
  content: |
    These values describe the saved backup rather than the current plan. The manifest records content and integrity information, while consistency and security scope describe how records were read. Use them when comparing backup coverage or investigating **Verification** failures. A user-selected export can contain fewer records than a broader scheduled plan because the user’s record access still applies.
- key: table:backups_run;field:qqqVersion
  summary: 'The framework version recorded when this backup was made.'
- key: table:backups_run;field:appVersion
  summary: 'The application version recorded when this backup was made.'
- key: table:backups_run;field:instanceName
  summary: 'The application instance from which the backup was made.'
- key: table:backups_run;field:schemaFingerprint
  summary: 'A fingerprint of the data structure recorded in the backup.'
  content: |
    These values describe the saved backup rather than the current plan. The manifest records content and integrity information, while consistency and security scope describe how records were read. Use them when comparing backup coverage or investigating **Verification** failures. A user-selected export can contain fewer records than a broader scheduled plan because the user’s record access still applies.
- key: table:backups_run;field:securityScope
  summary: 'Whether the backup reflects user-limited access or a broader plan execution.'
  content: |
    These values describe the saved backup rather than the current plan. The manifest records content and integrity information, while consistency and security scope describe how records were read. Use them when comparing backup coverage or investigating **Verification** failures. A user-selected export can contain fewer records than a broader scheduled plan because the user’s record access still applies.
- key: table:backups_run;field:encryptionKeyRef
  summary: 'The key reference recorded for the backup, without the key value.'
- key: table:backups_run;field:encryptionKeyFingerprint
  summary: 'A fingerprint identifying the encryption key without exposing it.'
- key: table:backups_run;field:retentionClass
  summary: 'The retention period category assigned to this backup.'
- key: table:backups_run;field:lockedUntil
  summary: 'The time until which storage retention protects this content from deletion.'
- key: table:backups_run;field:prunedDate
  summary: 'When this backup was pruned from storage.'
- key: table:backups_run;field:prunedByUserId
  summary: 'The user recorded as pruning this backup.'
- key: table:backups_run;field:verificationStatus
  summary: 'The latest recorded level and outcome of verification for this backup.'
  content: |
    The recorded states are {{values:backups_verification_status}}. Storage checks, content checks and test restores provide different evidence; a storage-only result does not establish that every record can be restored. Open the related **Verification** for its level, counts and diagnostics. This status describes checking after backup creation and is separate from the backup run’s own completion status.
- key: table:backups_run;field:warningCount
  summary: 'The number of warnings recorded during the backup.'
- key: table:backups_run;field:errorMessage
  summary: 'The error message recorded for this operation.'
- key: table:backups_run;field:errorDetail
  summary: 'Additional error information recorded for the failed backup.'
- key: table:backups_artifact;field:backupRunId
  summary: 'The backup run this record belongs to.'
- key: table:backups_artifact;field:artifactType
  summary: 'The kind of backup content stored in this artifact.'
- key: table:backups_artifact;field:tableName
  summary: 'The source table described by this record.'
- key: table:backups_artifact;field:partNumber
  summary: 'The sequence number of this part within the exported table data.'
- key: table:backups_artifact;field:objectKey
  summary: 'The path identifying the object within its storage bucket.'
- key: table:backups_artifact;field:format
  summary: 'The format recorded for this artifact’s content.'
- key: table:backups_artifact;field:compression
  summary: 'The compression recorded for this artifact’s content.'
- key: table:backups_artifact;field:encrypted
  summary: 'Whether this stored object is recorded as encrypted.'
- key: table:backups_artifact;field:rowCount
  summary: 'The number of records written to this artifact.'
- key: table:backups_artifact;field:bytesRaw
  summary: 'The data size in bytes before storage encoding.'
- key: table:backups_artifact;field:bytesStored
  summary: 'The data size in bytes as stored.'
- key: table:backups_artifact;field:sha256Stored
  summary: 'The checksum of the bytes as stored in the bucket.'
- key: table:backups_artifact;field:sha256Raw
  summary: 'The checksum of the content before storage encoding.'
- key: table:backups_artifact;field:rowsHash
  summary: 'The checksum representing the exported records.'
- key: table:backups_artifact;field:firstKey
  summary: 'The first record key recorded for this data part.'
- key: table:backups_artifact;field:lastKey
  summary: 'The last record key recorded for this data part.'
- key: table:backups_artifact;field:tableFingerprint
  summary: 'A fingerprint of the table structure used by this artifact.'
- key: table:backups_artifact;field:status
  summary: 'The recorded progress or final state of this operation.'
- key: table:backups_artifact;field:storageVersionId
  summary: 'The storage service’s version identifier for the saved object.'
- key: table:backups_verification;field:backupRunId
  summary: 'The backup run this record belongs to.'
- key: table:backups_verification;field:level
  summary: 'The depth of verification performed on this backup.'
  content: |
    The levels are {{values:backups_verify_level}}. Storage verification checks saved objects, content verification reads and compares backup data, and a test restore exercises recovery in a temporary destination. Review the result and detail to see what actually passed. A deeper check can provide more recovery evidence, but the level alone does not mean the check succeeded.
- key: table:backups_verification;field:trigger
  summary: 'What caused this verification to run.'
- key: table:backups_verification;field:requestedByUserId
  summary: 'The user who requested this operation.'
- key: table:backups_verification;field:startDate
  summary: 'When this operation started.'
- key: table:backups_verification;field:endDate
  summary: 'When this operation ended.'
- key: table:backups_verification;field:status
  summary: 'The recorded progress or final state of this operation.'
  content: |
    The possible results are {{values:backups_verify_result}}. Review the level, mismatch count and details together with the result. A check can pass with warnings or fail before completing all planned work. Use the linked **Backup Run** and its artifacts to investigate; changing a plan’s settings does not repair the stored content of an earlier backup.
- key: table:backups_verification;field:tablesChecked
  summary: 'The number of tables examined during verification.'
- key: table:backups_verification;field:rowsChecked
  summary: 'The number of records examined during verification.'
- key: table:backups_verification;field:mismatches
  summary: 'The number of discrepancies found during verification.'
- key: table:backups_verification;field:scratchTarget
  summary: 'The temporary destination recorded for a test restore.'
- key: table:backups_verification;field:detailJson
  summary: 'The structured results and diagnostics from verification.'
- key: table:backups_restore_run;field:sourceBackupRunId
  summary: 'The backup run used as the source for recovery.'
- key: table:backups_restore_run;field:requestedByUserId
  summary: 'The user who requested this operation.'
- key: table:backups_restore_run;field:startDate
  summary: 'When this operation started.'
- key: table:backups_restore_run;field:endDate
  summary: 'When this operation ended.'
- key: table:backups_restore_run;field:status
  summary: 'The recorded progress or final state of this operation.'
- key: table:backups_restore_run;field:mode
  summary: 'How the restore handles new and existing destination records.'
  content: |
    Restore mode controls how destination records are handled, while matching and identifier strategy control how saved records connect to them. Review these choices before execution: replacement can delete existing records and requires explicit confirmation. This row records the choices made for that run. Inspect the table results and any pre-restore backup before responding to an unexpected recovery outcome.
- key: table:backups_restore_run;field:idStrategy
  summary: 'Whether original record identifiers are preserved or replaced during recovery.'
  content: |
    Restore mode controls how destination records are handled, while matching and identifier strategy control how saved records connect to them. Review these choices before execution: replacement can delete existing records and requires explicit confirmation. This row records the choices made for that run. Inspect the table results and any pre-restore backup before responding to an unexpected recovery outcome.
- key: table:backups_restore_run;field:matchOn
  summary: 'The key used to match saved records to destination records.'
  content: |
    Restore mode controls how destination records are handled, while matching and identifier strategy control how saved records connect to them. Review these choices before execution: replacement can delete existing records and requires explicit confirmation. This row records the choices made for that run. Inspect the table results and any pre-restore backup before responding to an unexpected recovery outcome.
- key: table:backups_restore_run;field:targetInstanceName
  summary: 'The application instance receiving the restored data.'
