- key: process:backupRunPlan;slot:help
  summary: 'Preview a backup plan’s scope and run it when you continue.'
  content: |
    Use **Run backup now** on a **Backup Plan** when you need a fresh copy before a change or want to check the plan. Review the resolved scope and any warnings first; nothing is written until you continue. The run writes its output to the configured destination and records progress in **Backup Run**. Inspect its result and verify the saved content before relying on it for recovery.
- key: process:backupVerify;slot:help
  summary: 'Check a backup’s stored content against its manifest.'
  content: |
    Use **Verify backup** on a **Backup Run** to check that its objects are present and their contents match the recorded backup. The content check reads stored bytes, decodes them and compares counts and checksums with the manifest. It records a **Verification** result without changing the backup. Review mismatches and warnings before using that run as a recovery source.
- key: process:backupCheckSla;slot:help
  summary: 'Check whether backup plans meet their freshness and verification expectations.'
  content: |
    This monitoring action checks backup health against each plan’s expected backup and verification ages. Use **Backup Plan** and the Backups home page to inspect its assessment, then open the latest **Backup Run** or **Verification** for the underlying evidence. A health problem may require a new run, a storage repair or investigation of a failed check rather than simply changing the monitoring threshold.
- key: process:backupRestore;slot:help
  summary: 'Preview and restore data from a saved backup run.'
  content: |
    Use **Restore...** on a **Backup Run** to recover its data. Choose the tables, matching rule, record handling and file options, then review the proposed changes. Nothing is written until you continue. Replacement mode can delete destination records and requires confirmation. Review the option to back up the target first. After execution, inspect **Restore Run** and its table results for skipped records, warnings or failures.
- key: process:backupRestoreTable;slot:help
  summary: 'Preview and restore table data from a selected backup artifact.'
  content: |
    Use the table restore action when you need data from a particular backup artifact rather than the entire run. Check the source table, destination, matching rule and restore mode in the options and review screen. Nothing is written until you continue. Replacement can remove destination data. Inspect **Restore Run** and its table results afterward to confirm which records and files were recovered.
- key: process:backupImportCatalog;slot:help
  summary: 'Find saved backups in storage and add their metadata to the local catalog.'
  content: |
    Use **Import backups from storage** when backup objects exist in storage but their run records are absent from this application. Enter the backup bucket alias and folder prefix, then review the discovered backups before continuing. This imports catalog information; it does not restore application records. Once imported, inspect **Backup Run**, verify the saved content and choose a restore action when needed.
- key: process:backupDownload;slot:help
  summary: 'Create download links for the stored artifacts of selected backup runs.'
  content: |
    Use **Download** when you need the files belonging to a backup run outside the application. Review the files offered before continuing to obtain their links. The action does not restore records or change the saved backup. Treat the downloaded content according to the data it contains, and use **Artifacts** or **Verification** when you need to inspect completeness and integrity.
- key: process:backupDownloadArtifact;slot:help
  summary: 'Create a download link for a selected backup artifact.'
  content: |
    Use the artifact download action when you need a particular stored part of a backup. Review the selected artifact and its related **Backup Run** so you know which table or supporting file you are retrieving. The action returns a download link and does not change application records. A single part may not contain everything needed for a complete restore.
- key: process:backupRunScheduledPlan;slot:help
  summary: 'Execute a backup plan on behalf of its configured schedule.'
  content: |
    This background action runs a plan when invoked by scheduling. It checks the plan owner before starting the backup and records the resulting **Backup Run**. Use the plan’s latest run and error information to investigate a missed or failed execution. For an interactive preview and manual start, use **Run backup now** on the plan instead.
- key: process:backupCancelRun;slot:help
  summary: 'Request cancellation of a backup run that is still in progress.'
  content: |
    Use **Cancel** on a running backup when it should stop. Review the selected runs before continuing. Cancellation is a request to the running process, so check **Backup Run** afterward for its final state. It does not turn partial output into a complete backup or undo a previous successful run. Use a successfully completed and verified backup for recovery.
- key: process:backupCancelRestoreRun;slot:help
  summary: 'Request cancellation of a restore that is still in progress.'
  content: |
    Use **Cancel** on a restore when further recovery work should stop. Review the selection and then check **Restore Run** for its final status and table results. Cancellation does not imply that records already changed have been rolled back. Inspect the counts and any target backup before deciding how to recover from a partially completed restore.
- key: process:backupResumeRun;slot:help
  summary: 'Preview where an interrupted backup can continue and resume eligible work.'
  content: |
    Use **Resume** on an interrupted backup when you want to continue eligible work from its recorded progress. Review the proposed continuation and any reasons the run cannot resume before proceeding. Nothing is written during the preview. After execution, inspect **Backup Run** and its artifacts, then verify the completed backup before treating it as a recovery source.
- key: process:backupTestDestination;slot:help
  summary: 'Check whether a plan’s configured backup storage can be used.'
  content: |
    Use **Test destination** after configuring a **Backup Plan** destination. After review, the test writes a small probe object, reads it back, lists it and deletes it. For a plan using object locking, it only reads and writes no probe. Review each check and the capability report. This tests destination access, not the integrity of an existing backup; use **Verify backup** for that.
- key: process:backupPrune;slot:help
  summary: 'Preview and delete backups that a plan’s retention rules no longer keep.'
  content: |
    Use **Prune per retention** on a **Backup Plan** to remove expired backup content. Review exactly what will be deleted before continuing; the preview deletes nothing. Retention periods, minimum retained backups and storage locks affect eligibility. Pruning removes recovery material, so review the retained backups and their verification results before proceeding. Inspect the run catalog afterward for the recorded pruning result.
- key: process:backupPruneRuns;slot:help
  summary: 'Apply retention pruning to the plans associated with selected backup runs.'
  content: |
    Use **Prune per retention** on selected runs to evaluate the retention rules of their plans. The action is not simply a command to delete each selected row. Review the proposed deletions before continuing. Minimum retention and storage locks can protect backups from deletion. Pruning removes saved recovery content, so inspect the backups that will remain and their verification results first.
