- key: process:BackupPlanSyncToScheduledJobProcess;slot:help
  summary: Keep scheduled backup jobs aligned with your plan settings.
  content: |
    Set the plan's schedule, time zone and active status to control its scheduled backup job. This background integration synchronizes those settings when your application configures a scheduler. It does not start a backup immediately. Use **Run backup now** for a manual backup and inspect the plan's latest run to confirm execution.
- key: process:BackupPlanVerifySyncToScheduledJobProcess;slot:help
  summary: Keep scheduled verification jobs aligned with your plan settings.
  content: |
    Set the plan's verification schedule to request automatic checks when your application configures a scheduler. This background integration keeps the verification job aligned with the plan. Inspect **Verification** for completed checks; synchronizing a schedule does not verify a backup. Use **Verify backup** on a saved run for a manual check.
