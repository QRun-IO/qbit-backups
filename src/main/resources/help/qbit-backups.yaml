- key: table:backups_restore_run;field:automationsSuppressed
  summary: 'Whether record automations were suppressed during this restore.'
  content: |
    These recorded flags explain whether restoring records was allowed to trigger automations or publish change events. Restore options normally suppress automations and do not publish events, but the selected options determine the actual run. Use these values when investigating missing or unexpected downstream activity, and inspect the **Restore Run** results before manually repeating any follow-up work.
- key: table:backups_restore_run;field:esbSuppressed
  summary: 'Whether change-event publication was suppressed during this restore.'
  content: |
    These recorded flags explain whether restoring records was allowed to trigger automations or publish change events. Restore options normally suppress automations and do not publish events, but the selected options determine the actual run. Use these values when investigating missing or unexpected downstream activity, and inspect the **Restore Run** results before manually repeating any follow-up work.
- key: table:backups_restore_run;field:confirmationText
  summary: 'The confirmation entered for a replacement restore.'
  content: |
    Restore mode controls how destination records are handled, while matching and identifier strategy control how saved records connect to them. Review these choices before execution: replacement can delete existing records and requires explicit confirmation. This row records the choices made for that run. Inspect the table results and any pre-restore backup before responding to an unexpected recovery outcome.
